server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Proxy API calls to the Railway backend so the browser stays same-origin
  location /api/ {
    proxy_pass https://royalfeast-production.up.railway.app;
    proxy_set_header Host royalfeast-production.up.railway.app;
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
